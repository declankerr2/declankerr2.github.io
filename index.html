<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Declan Kerr — Mechanical Engineering</title>
<meta name="description" content="Engineering portfolio of Declan Kerr, mechanical engineering student at the University of Connecticut.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#12321f;
    --pine-lift:#1a4129;
    --gold:#c9a227;
    --paper:#f2efe6;
    --paper-dim:#b9c4b6;
  }

  *{box-sizing:border-box;}

  html,body{margin:0;padding:0;}

  body{
    background:var(--pine);
    color:var(--paper);
    font-family:"Inter",system-ui,sans-serif;
    font-size:17px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:9vh 24px 12vh;
  }

  main{width:100%;max-width:38rem;}

  h1{
    font-family:"Fraunces",Georgia,serif;
    font-weight:600;
    font-size:clamp(2.6rem,9vw,4.1rem);
    line-height:1.02;
    letter-spacing:-0.015em;
    margin:0;
  }

  .role{
    font-size:1.05rem;
    color:var(--paper-dim);
    margin:.7rem 0 0;
  }

  .rule{
    height:2px;
    background:var(--gold);
    border:0;
    margin:1.9rem 0 2.5rem;
  }

  .links{
    list-style:none;
    margin:0 0 3rem;
    padding:0;
  }

  .links li + li{margin-top:.9rem;}

  .links a{
    display:block;
    padding:1.05rem 1.3rem;
    background:var(--pine-lift);
    border-left:3px solid var(--gold);
    color:var(--paper);
    text-decoration:none;
    transition:background .15s ease;
  }

  .links a:hover,
  .links a:focus-visible{background:#225234;}

  .links a:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

  .links strong{
    font-family:"Fraunces",Georgia,serif;
    font-weight:600;
    font-size:1.2rem;
    display:block;
    letter-spacing:-0.01em;
  }

  .links span{
    font-size:.95rem;
    color:var(--paper-dim);
  }

  footer{
    font-size:.95rem;
    color:var(--paper-dim);
    border-top:1px solid rgba(242,239,230,.18);
    padding-top:1.4rem;
  }

  footer a{color:var(--paper);text-decoration:none;border-bottom:1px solid var(--gold);}
  footer a:hover{color:var(--gold);}
  footer a:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<main>

  <h1>Declan Kerr</h1>
  <p class="role">Mechanical &amp; Aerospace Engineering, University of Connecticut</p>

  <hr class="rule">

  <ul class="links">
    <li>
      <a href="portfolio.pdf">
        <strong>Engineering portfolio</strong>
        <span>Cycloidal robotic actuator, soldering fume extractor, wireless flow timer</span>
      </a>
    </li>
    <li>
      <a href="resume.pdf">
        <strong>Resume</strong>
        <span>One page, current as of 2026</span>
      </a>
    </li>
  </ul>

  <footer>
    <a href="mailto:dexkerr@icloud.com">dexkerr@icloud.com</a> &nbsp;·&nbsp;
    <a href="https://linkedin.com/in/declan-kerr">LinkedIn</a>
  </footer>

</main>
</body>
</html>
